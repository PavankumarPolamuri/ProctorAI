# Application Name & Port
spring.application.name=ProctorAI
server.port=${PORT:8080}

# Database Configuration (Defaults to MySQL-compatible H2 for zero-setup execution, configurable via env vars)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:examguarddb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# JPA & Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 Console (Enabled for local debugging/demo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:9a4f2c8d7e1b5a3f6c8e9d0b1a2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Jackson JSON Formatter
spring.jackson.serialization.write-dates-as-timestamps=false

# Multipart File Upload (if needed for avatars or attachments)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
